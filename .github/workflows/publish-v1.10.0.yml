name: Publish Codex Quota Bar v1.10.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.10.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v4
        with:
          ref: v1.10.0

      - name: Create release and upload assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: 'v1.10.0',
              name: 'Codex Quota Bar v1.10.0',
              body: fs.readFileSync('RELEASE_NOTES_v1.10.0.md', 'utf8'),
              draft: false,
              prerelease: false,
            });

            const assets = [
              {
                path: 'CodexQuotaBar.exe',
                name: 'CodexQuotaBar.exe',
                contentType: 'application/vnd.microsoft.portable-executable',
              },
              {
                path: 'RELEASE_NOTES_v1.10.0.md',
                name: 'RELEASE_NOTES_v1.10.0.md',
                contentType: 'text/markdown; charset=utf-8',
              },
            ];

            for (const asset of assets) {
              const data = fs.readFileSync(asset.path);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: asset.name,
                data,
                headers: {
                  'content-type': asset.contentType,
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${asset.name} (${data.length} bytes)`);
            }
            core.info(`Published ${release.data.html_url}`);
